
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoinWorld - Earn Rewards</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #080e1c;
    color: white;
}

header {
    background: #111c32;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #36d6a5;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 12px;
}

.hero {
    text-align: center;
    padding: 75px 20px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.hero span {
    color: #36d6a5;
}

.hero p {
    color: #bdc8dc;
    line-height: 1.7;
    margin-bottom: 25px;
}

button {
    background: #36d6a5;
    color: #081322;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    padding: 25px 18px;
    max-width: 950px;
    margin: auto;
}

h2 {
    margin-bottom: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.card {
    background: #14223b;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #253957;
}

.card h3 {
    color: #36d6a5;
    margin-bottom: 12px;
}

.card p {
    color: #bdc8dc;
    line-height: 1.6;
}

.wallet {
    margin-top: 30px;
    background: #14223b;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}
